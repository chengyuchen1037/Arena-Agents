# =============================================================================
# Arena-Agents 全局与预设剧本配置文件 (config.yml)
# 核心理念：引擎不绑定任何特定游戏逻辑，所有规则、频道建立、标签赋予与面板统计均由主持人通过工具运行时操控
# =============================================================================

app:
  title: "Arena-Agents"
  version: "v0.11"

scenario:
  path: "scenarios/werewolf_12p.md"

# -----------------------------------------------------------------------------
# 0. 规则与策略经验知识库目录 (供主持人与玩家通过 list_documents / read_document 查阅)
# -----------------------------------------------------------------------------
knowledge_base:
  docs_dir: "knowledge"
  description: "游戏规则手册、主持人执裁指南与各阵营博弈策略经验库"

# -----------------------------------------------------------------------------
# 1. LLM 模型、推理与价格配置 (默认全员接入 deepseek-flash 并开启最高档思考)
#
# v0.10 起，Provider（名称/协议/base_url/api_key/模型清单与逐模型价格）的主配置保存在
# 外部加密库（ARENA_DATA_DIR，默认 Windows 的 %LOCALAPPDATA%\Arena-Agent；Docker 为 /data），
# 逐参与者的模型绑定与思考深度保存在外部 settings.json / 存档里，均通过界面的“Provider”管理维护。
# 本节仅保留旧版默认值，用于：
#   * 旧 .env / 旧部署的迁移与兼容（DEEPSEEK_* 环境变量会形成只读的“环境变量 Provider”）；
#   * 未传入 binding 时的单元测试回退，以及超时/重试/温度/最大输出等非密钥通用参数。
# 这里不要写真实密钥；api_key 只通过环境变量插值，不会写回本文件。
# -----------------------------------------------------------------------------
llm:
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  api_key: "${DEEPSEEK_API_KEY}"
  default_model: "${DEEPSEEK_MODEL:-deepseek-flash}"
  temperature: 0.7
  max_tokens: 8192
  context_window_tokens: 1000000  # DeepSeek 默认 1M 上下文
  timeout_seconds: 120
  execution_depth: "medium"      # 执行链默认深度档位: low, medium, high, xhigh

  # 旧版全局 Token 单价（单位：美元 $ / 1M Tokens）。v0.10 起价格按模型在 Provider 管理里手动填写并
  # 随每次调用快照记账；这里的值仅作为“旧配置迁移”所创建模型的价格，以及无 binding 时的回退。
  pricing:
    input_price_per_m: 0.27
    output_price_per_m: 1.10

  # 请求重试：连接错误 / 超时 / 408 / 429 / 5xx 做指数退避 + 抖动；其它 4xx 不重试。
  # 流式调用只在尚未产出任何内容前重试。429 的 Retry-After 会被遵守（不超过 max_retry_after_seconds）。
  retry:
    max_attempts: 3                # 含首次请求的总尝试次数（1 = 不重试）
    base_delay_seconds: 0.5        # 第 n 次重试前等待 base * 2^(n-1)
    max_delay_seconds: 8           # 单次退避上限
    jitter: 0.25                   # 抖动比例 0~1：等待时间在 [d*(1-jitter), d] 内随机
    max_retry_after_seconds: 60    # 服务端 Retry-After 的采纳上限

  # 思考与推理深度设置（思维链仅观战者可见，绝不进入任何 Agent 上下文）
  # <think>...</think> 标签与原生 reasoning_content 始终都会被解析，无需配置。
  thinking:
    enabled: true
    reasoning_effort: "high"       # 默认推理深度档位；仅作为顶层参数发送一次（不要写进 extra_body）
    extra_body:                    # 透传给 OpenAI 兼容网关的扩展字段
      thinking:
        type: "enabled"

  # 可选：针对主持人覆盖模型参数（model / temperature）。
  # 也可以在此写 reasoning_effort 来强制覆盖主持人的推理深度；默认不写，
  # 这样主持人与玩家一致，跟随前端/会话里设置的值。
  moderator_override:
    model: "${DEEPSEEK_MODEL:-deepseek-flash}"
    temperature: 0.3

# -----------------------------------------------------------------------------
# 2. 参与者座位定义 (初始无任何标签，由主持人开局运行时赋予)
# -----------------------------------------------------------------------------
participants:
  - id: "p01"
    seat: "SEAT 01"
    name: "Alice 1"
    persona: "逻辑严密，善于从发言细节和投票轨迹中推敲破绽，发言条理清晰。"
