# =============================================================================
# Arena-Agents 全局与预设剧本配置文件 (config.yml)
# 核心理念：引擎不绑定任何特定游戏逻辑；规则由剧本（Markdown）声明，流程由主持人 agent
# 通过工具推进（频道、发言权、请求、公告、状态），所有 agent 都是异步的 Actor + Worker。
# =============================================================================

app:
  title: "Arena-Agents"
  version: "v0.12.1"

scenario:
  path: "scenarios/werewolf_12p.md"

# -----------------------------------------------------------------------------
# 异步运行时参数（v0.12.1）。时间单位均为秒；只影响调度，不影响规则。
# 引擎不做省钱设计：每条投递给 agent 的消息都会立刻激活它，一次激活内的“LLM → 工具”轮数没有上限；
# token 由编排管理（持久会话 + 前缀缓存 + 在途合并 + 按需压缩）。花多少钱由用户在界面上设置上限。
# -----------------------------------------------------------------------------
runtime:
  llm_concurrency: 0              # 同一时刻最多多少个 LLM 调用在途（全局）；0 = 不限（只为应对 Provider 限流时调小）
  llm_concurrency_per_provider: 0 # 同一 Provider 同时在途的上限；0 = 不限
  llm_timeout_seconds: 120        # 单次 LLM 调用的超时（含流式）
  tick_interval: 0.1              # 世界计时器与 agent 休眠定时器（sleep）的轮询间隔
  watchdog: 20                    # 对局静止多久后唤醒主持人（只唤醒主持人，不会自动暂停）
  max_watchdog_wakes: 3           # 连续唤醒仍无进展则在界面上显示警告（由用户决定是否暂停）
  compact_at: 0.6                 # 会话输入达到模型上下文窗口的这个比例时，提醒 agent 调用 compact_context
  trim_at: 0.9                    # 达到这个比例仍未压缩时，兜底裁剪最早的完整轮次

# -----------------------------------------------------------------------------
# 0. 规则与策略经验知识库目录 (供主持人与玩家通过 list_documents / read_document 查阅)
# -----------------------------------------------------------------------------
knowledge_base:
  docs_dir: "knowledge"
  description: "游戏规则手册、主持人执裁指南与各阵营博弈策略经验库"

# -----------------------------------------------------------------------------
# 1. LLM 模型、推理与价格配置 (默认全员接入 deepseek-flash 并开启最高档思考)
#
# v0.10 起，Provider（名称/协议/base_url/api_key/模型清单与逐模型价格）的主配置保存在
# 外部加密库（ARENA_DATA_DIR，默认 Windows 的 %LOCALAPPDATA%\Arena-Agent；Docker 为 /data），
# 逐参与者的模型绑定与思考深度保存在外部 settings.json / 存档里，均通过界面的“Provider”管理维护。
# 本节仅保留旧版默认值，用于：
#   * 旧 .env / 旧部署的迁移与兼容（DEEPSEEK_* 环境变量会形成只读的“环境变量 Provider”）；
#   * 未传入 binding 时的单元测试回退，以及超时/重试/温度/最大输出等非密钥通用参数。
# 这里不要写真实密钥；api_key 只通过环境变量插值，不会写回本文件。
# -----------------------------------------------------------------------------
llm:
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  api_key: "${DEEPSEEK_API_KEY}"
  default_model: "${DEEPSEEK_MODEL:-deepseek-flash}"
  temperature: 0.7
  max_tokens: 8192
  context_window_tokens: 1000000  # DeepSeek 默认 1M 上下文
  timeout_seconds: 120

  # 旧版全局 Token 单价（单位：美元 $ / 1M Tokens）。v0.10 起价格按模型在 Provider 管理里手动填写并
  # 随每次调用快照记账；这里的值仅作为“旧配置迁移”所创建模型的价格，以及无 binding 时的回退。
  pricing:
    input_price_per_m: 0.27
    output_price_per_m: 1.10

  # 请求重试：连接错误 / 超时 / 408 / 429 / 5xx 做指数退避 + 抖动；其它 4xx 不重试。
  # 流式调用只在尚未产出任何内容前重试。429 的 Retry-After 会被遵守（不超过 max_retry_after_seconds）。
  retry:
    max_attempts: 3                # 含首次请求的总尝试次数（1 = 不重试）
    base_delay_seconds: 0.5        # 第 n 次重试前等待 base * 2^(n-1)
    max_delay_seconds: 8           # 单次退避上限
    jitter: 0.25                   # 抖动比例 0~1：等待时间在 [d*(1-jitter), d] 内随机
    max_retry_after_seconds: 60    # 服务端 Retry-After 的采纳上限

  # 思考与推理深度设置（思维链仅观战者可见，绝不进入任何 Agent 上下文）
  # <think>...</think> 标签与原生 reasoning_content 始终都会被解析，无需配置。
  thinking:
    enabled: true
    reasoning_effort: "high"       # 默认推理深度档位；仅作为顶层参数发送一次（不要写进 extra_body）
    extra_body:                    # 透传给 OpenAI 兼容网关的扩展字段
      thinking:
        type: "enabled"

  # 可选：针对主持人覆盖模型参数（model / temperature）。
  # 也可以在此写 reasoning_effort 来强制覆盖主持人的推理深度；默认不写，
  # 这样主持人与玩家一致，跟随前端/会话里设置的值。
  moderator_override:
    model: "${DEEPSEEK_MODEL:-deepseek-flash}"
    temperature: 0.3

# -----------------------------------------------------------------------------
# 2. 参与者座位定义 (初始无任何标签，由主持人开局运行时赋予)
#
# v0.12.1：内部 id 固定为 N1–N12（编号即座位号），默认名字是 Alice…Leo（不带数字）；模型看到的称呼是
# “N3 Carol”，界面上只显示名字。名字、头像、性格设定与记忆由工作区的名册（roster）按座位号保存，
# 这里只给出开局前的默认值；不再有 persona 字段。
# -----------------------------------------------------------------------------
participants:
  - id: "N1"
    seat: "1"
    name: "Alice"
  - id: "N2"
    seat: "2"
    name: "Bob"
  - id: "N3"
    seat: "3"
    name: "Carol"
  - id: "N4"
    seat: "4"
    name: "David"
  - id: "N5"
    seat: "5"
    name: "Eve"
  - id: "N6"
    seat: "6"
    name: "Frank"
  - id: "N7"
    seat: "7"
    name: "Grace"
  - id: "N8"
    seat: "8"
    name: "Henry"
  - id: "N9"
    seat: "9"
    name: "Ivy"
  - id: "N10"
    seat: "10"
    name: "Jack"
  - id: "N11"
    seat: "11"
    name: "Kate"
  - id: "N12"
    seat: "12"
    name: "Leo"

# -----------------------------------------------------------------------------
# 4. 标签样式与卡片置灰规则 (tag_styles)
# 身份池与规则由 scenario.path 指向的 Markdown 唯一定义；此处仅负责展示。
# -----------------------------------------------------------------------------
tag_styles:
  # 左侧身份标签 (slot: "left")
  "狼人":
    slot: "left"
    variant: "danger"
    gray_out_card: false
  "白狼王":
    slot: "left"
    variant: "danger"
    gray_out_card: false
  "平民":
    slot: "left"
    variant: "neutral"
    gray_out_card: false
  "预言家":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "女巫":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "猎人":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "守卫":
    slot: "left"
    variant: "purple"
    gray_out_card: false

  # 右侧状态与徽标标签 (slot: "right")
  "存活":
    slot: "right"
    variant: "success"
    gray_out_card: false
  "警长":
    slot: "right"
    variant: "warning"
    gray_out_card: false
  "出局":
    slot: "right"
    variant: "muted"
    gray_out_card: true
  "死亡":
    slot: "right"
    variant: "muted"
    gray_out_card: true

# -----------------------------------------------------------------------------
# 5. 提示词模板路径（模板变量见 prompts/*.md；规则正文与主持人手册来自剧本）
# -----------------------------------------------------------------------------
prompts:
  moderator_system: "prompts/moderator.md"
  participant_system: "prompts/participant.md"
