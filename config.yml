# -----------------------------------------------------------------------------
# 4. 标签样式与卡片置灰规则 (tag_styles)
# 身份池与规则由 scenario.path 指向的 Markdown 唯一定义；此处仅负责展示。
# -----------------------------------------------------------------------------
tag_styles:
  # 左侧身份标签 (slot: "left")
  "狼人":
    slot: "left"
    variant: "danger"
    gray_out_card: false
  "白狼王":
    slot: "left"
    variant: "danger"
    gray_out_card: false
  "平民":
    slot: "left"
    variant: "neutral"
    gray_out_card: false
  "预言家":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "女巫":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "猎人":
    slot: "left"
    variant: "purple"
    gray_out_card: false
  "守卫":
    slot: "left"
    variant: "purple"
    gray_out_card: false

  # 右侧状态与徽标标签 (slot: "right")
  "存活":
    slot: "right"
    variant: "success"
    gray_out_card: false
  "警长":
    slot: "right"
    variant: "warning"
    gray_out_card: false
  "出局":
    slot: "right"
    variant: "muted"
    gray_out_card: true
  "死亡":
    slot: "right"
    variant: "muted"
    gray_out_card: true

# -----------------------------------------------------------------------------
# 5. 初始状态（未开始时频道与面板均为空，全部由主持人调用工具创建与更新）
# -----------------------------------------------------------------------------
initial_state:
  phase_text: "未开始 · 等待主持人初始化"

# -----------------------------------------------------------------------------
# 6. 提示词模板路径与开局引导指令
# -----------------------------------------------------------------------------
prompts:
  moderator_system: "prompts/moderator.md"
  participant_system: "prompts/participant.md"
  kickoff_instruction: |
    对局正式开始。请依据当前会话中提供的剧本说明与通用工具初始化参与者状态、频道和展示信息，然后按剧本推进。不要自行发明规则；可执行 Markdown 模式下此提示不参与流程驱动。
  resume_instruction: |
    对局从当前进度继续运行。请查看当前阶段与最新频道消息记录，依据当前剧本继续执行下一步。
