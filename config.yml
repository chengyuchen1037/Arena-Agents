    seat: "SEAT 02"
    name: "Bob 2"
    persona: "稳健谨慎，倾向于整合场上多方信息后再站边，不轻易盲从。"
  - id: "p03"
    seat: "SEAT 03"
    name: "Carol 3"
    persona: "直觉敏锐，关注玩家言行的一致性与情绪变化，敢于果断出手。"
