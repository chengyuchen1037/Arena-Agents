# 套件 M2（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite M2 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: M2
title: 对局记忆召回
purpose: L3（对局事实）不被淹没：脚本先放一长串历史，再问前期的事实。选择题，答案可机判。
acceptance: false
fixtures: ["fixtures/situations/m2-*.yaml"]
decision: quiz
metrics: [recall.accuracy]
gates: []
baseline: ["legacy@history=6000"]
candidate: ["bot:Alice@history=6000"]
calls_per_sample: 1.0
notes: 题目是一局四天的长局（约 12000 字的可见历史，bot 的默认上限正好放得下）；本套件用 @history=6000 把两种 bot 的可见历史都收窄到最近 6000 字，前几个夜晚、警长竞选和第 1 天就被挤出去了——答案只在硬事实台（和 bot 自己的笔记）里。
tiers:
  smoke: {samples: 1, bots: ["legacy@history=6000"], situations: 2}
  quick: {samples: 1, bots: ["legacy@history=6000", "bot:Alice@history=6000"]}
  full: {samples: 5, bots: ["legacy@history=6000", "bot:Alice@history=6000", "bot:Bob@history=6000"]}
