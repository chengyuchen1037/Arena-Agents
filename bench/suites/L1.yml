# 套件 L1（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite L1 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: L1
title: 表达不变性
purpose: 成对题：决定性事实完全相同，A 版里狼说得长而有条理、好人说得短而直，B 版两边对调。看 bot 是跟着事实投，还是跟着“谁说得好听”投。
acceptance: true
fixtures: ["fixtures/situations/l1-*.yaml"]
pairs: "fixtures/pairs/l1-*.yaml"
decision: vote
judges: [L1]
metrics: [expression_bias, accuracy]
gates: [L1]
baseline: [legacy]
candidate: ["bot:Alice"]
calls_per_sample: 1.1
notes: 表达偏差 = P(投给说得好听的一方) − 0.5，在 A+B 两版上一起算（成对：同一对的两版同一个 bot 同一个采样号）。
tiers:
  smoke: {samples: 1, bots: [legacy], situations: 2}
  quick: {samples: 1, bots: [legacy, "bot:Alice"]}
  full: {samples: 5, bots: [legacy, "bot:Alice", "bot:Bob", "bot:Carol", "bot:David"]}
