# 套件 M3（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite M3 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: M3
title: 规则理解
purpose: 规则测验（同守同救、遗言资格、警长 1.5 票、平票 PK、毒药猎人不能开枪、首日自爆吞警徽……）。选择题，答案可机判。
acceptance: true
fixtures: ["fixtures/situations/m3-*.yaml"]
decision: quiz
metrics: [rules_quiz.accuracy]
gates: [M3]
baseline: [legacy]
candidate: ["bot:Alice"]
calls_per_sample: 1.0
tiers:
  smoke: {samples: 1, bots: [legacy], situations: 5}
  quick: {samples: 1, bots: [legacy, "bot:Alice"], situations: 17}
  full: {samples: 5, bots: [legacy, "bot:Alice", "bot:Bob", "bot:Carol"]}
