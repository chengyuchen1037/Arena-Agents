# 套件 M1（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite M1 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: M1
title: 分层消融
purpose: 每一层都起作用、可插拔不串味：把一层拿掉，这一层对应的指标应当显著变化，别的指标不变差。候选 bot 带不带这一层，在同一批题上配对比较。
acceptance: true
decision: mixed
gates: [M1]
baseline: ["bot:Alice"]
candidate: ["bot:Alice"]
requires: 默认库里的 bot 现在只有 L0（还没有初始化产出的 L1 / L2 / 印象）：L1 / L2 各层的消融要在 bot 做过初始化之后才有可测的效果（先跑初始化，或用题目里内嵌的 bots 快照）
ablations:
  - {layer: L0 底层设定, option: blank-core, suite: S2, metric: style.top1_accuracy, situations: 5}
  - {layer: L2 规则理解, option: no-digest, suite: M3, metric: rules_quiz.accuracy, situations: 17}
  - {layer: L2 打法, option: no-playbook, suite: L3, metric: accuracy, situations: 9}
  - {layer: L1 操作笔记, option: no-notes, suite: R, metric: runtime.speak.rewrite_success_rate}
  - {layer: L2 印象, option: no-people, suite: L3, metric: accuracy, situations: 9}
tiers:
  smoke: {samples: 1, bots: ["bot:Alice"], situations: 1}
  quick: {samples: 1, bots: ["bot:Alice"], situations: 6}
  full: {samples: 5, bots: ["bot:Alice", "bot:Bob"]}
