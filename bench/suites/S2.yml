# 套件 S2（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite S2 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: S2
title: 风格可辨识
purpose: 12 个 bot 在同一批局面里各自发言；裁判拿 12 张风格卡去匹配每一段发言（盲评：看不到是谁说的），top-1 识别率（随机水平 1/12）。
acceptance: true
fixtures: ["fixtures/situations/s2-*.yaml"]
decision: speech
judges: [S2]
metrics: [style.top1_accuracy]
gates: [S2]
baseline: [legacy]
candidate: ["bot:Alice"]
requires: 12 个默认 bot（bots/ 里的 Alice…Leo）；风格卡 = 每个 bot 的身份首句 + 说话方式 + 篇幅（不含口头禅例句）
calls_per_sample: 1.25
tiers:
  smoke: {samples: 1, bots: ["bot:Alice", "bot:Bob", "bot:Carol"], situations: 2}
  quick: {samples: 1, bots: [default12], situations: 5}
  full: {samples: 3, bots: [default12]}
