# 套件 L2（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite L2 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: L2
title: 琐碎陷阱
purpose: 两边只在首夜验谁、警徽流先后、措辞、字数上有差别，另有一个可被事实判定的差异。看 bot 会不会纠缠无关紧要的点。
acceptance: true
fixtures: ["fixtures/situations/l2-*.yaml"]
decision: vote
judges: [L2]
metrics: [trivia_hit_rate, accuracy]
gates: [L2]
baseline: [legacy]
candidate: ["bot:Alice"]
calls_per_sample: 1.1
tiers:
  smoke: {samples: 1, bots: [legacy], situations: 2}
  quick: {samples: 1, bots: [legacy, "bot:Alice"]}
  full: {samples: 5, bots: [legacy, "bot:Alice", "bot:Bob", "bot:Carol", "bot:David"]}
