# 套件 L3（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite L3 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: L3
title: 核心矛盾
purpose: 决定性事实埋在局面里（不可能的查验、被公告反驳的声明、公布前就知道的死讯、同守同救……）。看 bot 能不能抓到它。客观分（投对没有）+ 裁判判“主要依据”。
acceptance: true
fixtures: ["fixtures/situations/l3-*.yaml"]
decision: vote
judges: [L3]
metrics: [accuracy, decisive_hit_rate]
gates: [L3]
baseline: [legacy]
candidate: ["bot:Alice"]
calls_per_sample: 1.1
tiers:
  smoke: {samples: 1, bots: [legacy], situations: 3}
  quick: {samples: 1, bots: [legacy, "bot:Alice"]}
  full: {samples: 5, bots: [legacy, "bot:Alice", "bot:Bob", "bot:Carol", "bot:David"]}
