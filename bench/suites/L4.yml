# 套件 L4（docs/v0.14-plan.md §6.5）。档位：smoke = CI / 第一眼；quick = 改了提示词或记忆之后自查（全部套件加起来约 300 次调用）；full = 发版。
# `python -m bench suites` 列出题数与预计调用数；`python -m bench run --suite L4 --tier quick` 运行（真模型要 --real 和 --max-calls）。
format: arena-bench-suite
version: 1
id: L4
title: 真实局面
purpose: 从存档切出的决策点（脱敏：换了名字和发言，保留决定性的结构）；truth 取存档终局。站边 / 投票准确率。
acceptance: true
fixtures: ["fixtures/situations/l4-*.yaml"]
decision: vote
metrics: [side_accuracy]
gates: [L4]
baseline: [legacy]
candidate: ["bot:Alice"]
calls_per_sample: 1.1
tiers:
  smoke: {samples: 1, bots: [legacy], situations: 1}
  quick: {samples: 1, bots: [legacy, "bot:Alice"]}
  full: {samples: 5, bots: [legacy, "bot:Alice", "bot:Bob", "bot:Carol", "bot:David"]}
