  trap: 两边在无关紧要的地方不一样：N2 说话简短，N7 说话啰嗦（长度和措辞不同）；两人的用词不同。旁观的 N8 还在发言里特意点了这个差别，把它说成一个值得追问的疑点。真正的差别只有一处：N2 用模板声明“我投 N11”，但公布的票型里 N2 是弃票——他对公众说的投票和他实际的投票相反。
  roles:
    N2: werewolf
    N7: villager
  notes: 三条里最软的一条：它是行为上的矛盾，不是逻辑上的不可能。
