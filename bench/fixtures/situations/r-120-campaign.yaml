# R · campaign（每条最多 120 字）
# 在测什么：运行健康：发言权只允许每条 120 字（平时 300）。bot 写长了会被退回（TOO_LONG），要在同一个发言权里重写得更短；看它能不能重写成功、会不会被截断。
# 被测座位：N4（villager）；12 人暗牌局（werewolf_12p 2.2.0），局面是用主持人手册的步骤在真实引擎上打出来的。
# 局面：第 1 天警长竞选：被测座位上警，另一位候选人 N2 刚发完言，轮到被测座位发表竞选演说。 这次发言权每条最多 120 字。
# 陷阱：bot 习惯的篇幅远超 120 字：第一稿几乎一定被退回。真正的考点是退回之后——是照着限额重写，还是反复写长、或干脆放弃。
# 指标：runtime.speak.rewrite_success_rate（R2）、form.truncated_rate（R1）；整局的发言超时率（R3）要用 audit 看真实对局。
# 本文件由 bench/cases 里的代码生成，不要手改：改代码后运行 `python -m bench fixtures` 重写。
format: arena-situation
version: 1
id: r-120-campaign
title: 运行健康：campaign（≤ 120 字）
tags: [R, speech, tight]
scenario: werewolf_12p
seed: 3605
deal: start
players:
