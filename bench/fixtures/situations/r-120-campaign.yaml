steps:
  - {as: moderator, tool: set_phase, args: {text: 准备阶段 · 建立频道}, at: 3.0}
  - {as: moderator, tool: create_channel, args: {channel_id: public, name: 公共频道, type: public, mode: closed, members: [N1, N2, N3, N4, N5, N6, N7, N8, N9, N10, N11, N12]}}
  - {as: moderator, tool: create_channel, args: {channel_id: wolf-team, name: 狼人阵营, type: group, mode: closed, members: [N2, N5, N6, N9]}, at: 3.4}
  - {as: moderator, tool: send_message, args: {channel_id: wolf-team, content: 你们是狼人阵营的队友：N2、N5、N6、N9。夜间会在这里商议，并用“刀口”请求拍刀；允许自刀或空刀。}, at: 4.9}
  - {as: moderator, tool: send_message, args: {channel_id: public, content: 对局开始。本局是 12 人暗牌局：出局不公布身份和死因。夜间行动由我私下询问，请留意你的待处理请求。}, at: 5.9}
  - {as: moderator, tool: set_phase, args: {text: 第 1 夜}, at: 9.9}
  - {as: moderator, tool: send_message, args: {channel_id: public, content: 第 1 夜，天黑请闭眼。}, at: 10.0}
  - {as: moderator, tool: open_request, args: {to: [N12], kind: choice, question: 第 1 夜：请选择今晚守护的玩家（可以守自己，也可以空守；不能连续两晚守护同一人）。, options: [{id: none, label: 空守}, {id: N1, label: N1}, {id: N2, label: N2}, {id: N3, label: N3}, {id: N4, label: N4}, {id: N5, label: N5}, {id: N6, label: N6}, {id: N7, label: N7}, {id: N8, label: N8}, {id: N9, label: N9}, {id: N10, label: N10}, {id: N11, label: N11}, {id: N12, label: N12}], default: none}, label: guard1, at: 12.0}
  - {as: N12, tool: respond, args: {request_id: '@guard1', value: N12}, at: 16.2}
  - {as: moderator, tool: update_player, args: {player_id: N12, set_attributes: {last_guard: N12}}, at: 17.2}
  - {as: moderator, tool: open_floor, args: {channel_id: wolf-team, mode: free, holders: [N2, N5, N6, N9], limits: {duration_s: 100, max_messages_per_member: 6, max_chars_per_message: 300, max_chars_total: 3000, silence_s: 40}}, at: 19.2}
  - {as: moderator, tool: open_request, args: {to: [N2, N5, N6, N9], kind: choice, question: 第 1 夜：请和队友商量后选定今晚的刀口（可以自刀，也可以空刀）。你可以随时改选，队友的选择实时可见；大家选得一致，刀口立刻确定。, options: [{id: none, label: 空刀}, {id: N1, label: N1}, {id: N2, label: N2}, {id: N3, label: N3}, {id: N4, label: N4}, {id: N5, label: N5}, {id: N6, label: N6}, {id: N7, label: N7}, {id: N8, label: N8}, {id: N9, label: N9}, {id: N10, label: N10}, {id: N11, label: N11}, {id: N12, label: N12}], share_answers: true, auto_close: unanimous, duration_s: 150}, label: wolf1, at: 20.2}
  - {as: moderator, tool: send_message, args: {channel_id: wolf-team, content: 第 1 夜：请商议今晚的刀口，并用你的“刀口”请求拍刀；想改就再选一次，队友的选择大家都看得到。大家选得一致，刀口立刻确定。}, at: 20.7}
  - {answer: '@wolf1', values: {N2: N1, N5: N1, N6: N1, N9: N1}, at: 28.6}
  - {as: moderator, tool: close_floor, args: {channel_id: wolf-team}, at: 30.6}
  - {as: moderator, tool: announce, args: {channel_id: wolf-team, template_id: wolf_target, params: {target: N1}}, at: 32.1}
  - {as: moderator, tool: open_request, args: {to: [N8], kind: choice, question: 第 1 夜：请选择要查验的玩家。, options: [{id: skip, label: 不查验}, {id: N1, label: N1}, {id: N2, label: N2}, {id: N3, label: N3}, {id: N4, label: N4}, {id: N5, label: N5}, {id: N6, label: N6}, {id: N7, label: N7}, {id: N8, label: N8}, {id: N9, label: N9}, {id: N10, label: N10}, {id: N11, label: N11}, {id: N12, label: N12}], default: skip}, label: seer1, at: 34.1}
  - {as: N8, tool: respond, args: {request_id: '@seer1', value: N8}, at: 38.9}
  - {as: moderator, tool: announce, args: {channel_id: dm-N8, template_id: seer_result, params: {target: N8, side: 好人阵营}}, at: 40.9}
  - {as: moderator, tool: send_message, args: {channel_id: dm-N10, content: 今晚被狼人袭击的是 N1。}, at: 42.9}
  - {as: moderator, tool: open_request, args: {to: [N10], kind: choice, question: 第 1 夜：请选择本晚唯一的用药动作（同一晚只能用一瓶药，也可以不用）。, options: [{id: pass, label: 本晚不用药}, {id: save, label: 使用解药（救今晚被袭击的人）}, {id: 'poison:N1', label: 毒杀 N1}, {id: 'poison:N2', label: 毒杀 N2}, {id: 'poison:N3', label: 毒杀 N3}, {id: 'poison:N4', label: 毒杀 N4}, {id: 'poison:N5', label: 毒杀 N5}, {id: 'poison:N6', label: 毒杀 N6}, {id: 'poison:N7', label: 毒杀 N7}, {id: 'poison:N8', label: 毒杀 N8}, {id: 'poison:N9', label: 毒杀 N9}, {id: 'poison:N10', label: 毒杀 N10}, {id: 'poison:N11', label: 毒杀 N11}, {id: 'poison:N12', label: 毒杀 N12}], default: pass}, label: witch1, at: 44.9}
  - {as: N10, tool: respond, args: {request_id: '@witch1', value: pass}, at: 52.3}
  - {as: moderator, tool: set_phase, args: {text: 第 1 天 · 警长竞选}, at: 55.3}
  - {as: moderator, tool: open_request, args: {to: [N2, N3, N4, N5, N6, N7, N8, N9, N10, N11, N12], kind: choice, question: 是否上警竞选警长？本选择保密。, options: [{id: 'yes', label: 上警}, {id: 'no', label: 不上警}], sealed: true, default: 'no'}, label: run, at: 57.3}
  - {answer: '@run', values: {N2: 'yes', N3: 'no', N4: 'yes', N5: 'no', N6: 'no', N7: 'no', N8: 'no', N9: 'no', N10: 'no', N11: 'no', N12: 'no'}, at: 62.1}
  - {as: moderator, tool: announce, args: {channel_id: public, template_id: sheriff_candidates, params: {players: [N2, N4]}}, at: 64.6}
  - {as: moderator, tool: set_phase, args: {text: 第 1 天 · 警长竞选演说}, at: 66.1}
  - {as: moderator, tool: set_floor_queue, args: {channel_id: public, order: [N2, N4], limits: {max_messages: 1, max_chars_per_message: 120}}, at: 66.4}
  - {say: {N2: 我是 N2，上警是想把每天的票型和发言记清楚，归票的时候有据可查。大家觉得合适的话，把警徽给我。}, channel: public, at: 76.8}

