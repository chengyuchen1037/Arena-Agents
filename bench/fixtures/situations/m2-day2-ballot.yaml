  - {say: {N9: 我复盘了一下昨天的票型，没有发现特别反常的地方。今天我会继续留意有没有人票型和说法对不上，这是我目前能用的唯一方法。 这一轮我想听听每个人对昨晚结果的看法，因为那是目前唯一确定的事实。我自己没有怀疑对象，等发言轮完我再认真选一个，不会随便弃票。 我对今天的局面有个朴素的想法：信息少的时候不要冒险出人，宁可多留一轮观察。如果大家都同意，我这轮可以弃票，除非有人拿出确凿的东西。}, channel: public, at: 439.7}
