  - {say: {N12: 我这轮的重点是听预言家和其他神职有没有要补充的，因为他们手里的信息最多。如果没有人站出来，我就按自己的判断投票。 我想提醒大家，白天的信息大多是别人说出来的，真假自负，只有公告和投票结果才是确定的。我会优先用确定的东西做判断，说法只作参考。 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。}, channel: public, at: 690.0}
