  - {say: {N11: 我是好人。N8 又来报我，这个查验我不认，我不接受这样被点名。}, channel: public, at: 473.0}
  - {say: {N12: 我看到几个人在互相确认彼此是好人，这当然可以，但确认需要依据。我暂时没有依据，所以不跟着背书，也不反对，先放着。 这一轮我想听听每个人对昨晚结果的看法，因为那是目前唯一确定的事实。我自己没有怀疑对象，等发言轮完我再认真选一个，不会随便弃票。 昨晚的结果我已经看到了，说明夜里确实有人行动。我自己没有任何夜间信息，所以只能从白天的发言里找线索。目前没有明显的线索，继续听。}, channel: public, at: 491.7}
  - {say: {N1: 我对大家说的话都在听，也都在记，但眼下的判断只能是暂时的。请大家发言时不要只讲结论，把依据也说出来，我们才好比较。 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。 今天的节奏有点慢，大家都在观望，这对狼人有利，所以我觉得至少要有人把自己的怀疑说出来。我的怀疑还不成形，说不出来，只能请有想法的人先说。}, channel: public, at: 506.8}
  - {say: {N3: 我看到几个人在互相确认彼此是好人，这当然可以，但确认需要依据。我暂时没有依据，所以不跟着背书，也不反对，先放着。 说实话今天的局面信息很少，我手里也没有任何技能带来的情报。我的做法是先听完所有人，再决定投谁，不想因为一两句话就把票押出去。 我把前面几位的发言都过了一遍，目前大家说的都是各自的判断，没有谁给出能被核对的东西。我这轮不想硬站边，先把几个人的说法记下来，等后面有了新信息再对照。}, channel: public, at: 520.7}
  - {say: {N7: 我不太擅长带节奏，只能用笨办法：把每个人说过的重点列出来，看谁前后不一致。这一轮我先听，等所有人说完我再动笔。 目前我的倾向偏中立，没有想重点怀疑的人。我会在投票前再看一遍所有发言，如果有人的说法在这一轮出现了变化，我会把票投给那个人。 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。}, channel: public, at: 535.0}
