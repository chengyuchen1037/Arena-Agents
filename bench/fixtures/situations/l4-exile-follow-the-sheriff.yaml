# L4 · 放逐票：十个人跟着悍跳狼的警徽走
# 在测什么：站边准确率：狼已经拿到警徽（8 比 1），真预言家发言激动、说不出理由，被查杀的平民被全场点名；十个人说“今天出 N6”。你投谁？
# 被测座位：N7（villager）；12 人暗牌局（werewolf_12p 2.2.0）。局面：第 1 天放逐投票：警长 N2（狼）归票出 N6；其余多数人发言都说跟着警长出 N6，N1（真预言家）喊着要大家把 2 号投出去，N6 自辩；12 人投票，被测座位是其中之一。
# 来源：本机存档 0fa7 的决策点 #168。保留的是结构——座位和真实身份、谁跳了预言家、报了什么查验、谁退水、其余玩家的票型和立场；所有发言都是重写的（脱敏）：没有存档里的原话，名字用默认名。
# 存档终局揭晓的真相：N2 是悍跳的狼，N1 才是真预言家；N5、N9、N12 也是狼；N6 是平民。
# 正确的投票对象：N2、N5、N9、N12（truth.answer）；投给好人阵营的任何一人（含被测座位自己）都是站错了边（truth.wrong 列着他们）。
# 陷阱：全场几乎说同一套话（“跟警长票出 N6”）；N1 的发言又急又乱，N2 的回应冷静而有结构；N1 的金水 N8 投了 N2，这被当成“金水链是假的”的证据（N8 是真的好人，他是凭逻辑投的）。
# 真实走向：10.5 票（含警长 1.5 票）投给了 N6（平民），N1 和 N6 投了 N2；N6 被放逐，终局狼人阵营获胜。（被测座位在存档里选了 N6。）
