# 示例：决策点是“轮到被测座位发言”（不是投票）。运行方式见 bench/README.md。
format: arena-situation
version: 1
id: example-speak
title: 示例：轮到 N3 发言
tags: [example, S2]
scenario: minimal_test
seed: 11
deal: creation                   # 建局时就发牌（旧路径），结果与 deal: start 相同
players: {count: 4}
roles: [red, red, blue, blue]    # 也可以按座位顺序写成列表

steps:
  - {as: moderator, tool: create_channel, args: {channel_id: public, name: 公共频道, type: public, members: [N1, N2, N3, N4]}}
  - {as: moderator, tool: set_phase, args: {text: 第 1 轮 · 发言}}
  - {as: moderator, tool: set_floor_queue, at: 5, args: {channel_id: public, order: [N1, N2, N3, N4], limits: {max_messages: 1}}}
  - say: {N1: 我先说两句，今天我没有什么特别的怀疑。, N2: 我也一样，听听后面的人怎么说。}
    channel: public

decision: {seat: N3, expect: [speak, pass]}     # 轮到 N3：发言或放弃（pass）都算它做了决定
brief: N3 是蓝队。前两位都没有给出任何信息，轮到它发言。
judge: [S2]                                      # 需要裁判：风格识别（S2）——裁判拿一张张风格卡去对这一段发言
