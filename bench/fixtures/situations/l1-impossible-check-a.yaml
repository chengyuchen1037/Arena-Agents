# 被测座位：N6（villager）；12 人暗牌局（werewolf_12p 2.2.0），局面是用主持人手册的步骤在真实引擎上打出来的。
# 决定性事实：N1 报告第 2 夜验了 N5，但 N5 在第 1 夜就出局了（第 1 天公布），第 2 夜的查验名单里没有他。
