# L4 · 警长票：说得短的真预言家，对说得长的悍跳狼
# 在测什么：站边准确率：两个人都说自己是预言家，一个说得又短又直、验人理由很怪、警徽流含糊，一个说得长而有条理、报了一个查杀、还把警徽流排得整整齐齐；被报查杀的第三位候选人退了水。该投谁？
# 被测座位：N7（villager）；12 人暗牌局（werewolf_12p 2.2.0）。局面：第 1 天警长竞选：N1、N2、N6 上警，N1 和 N2 都自称预言家（N1 报 N8 金水，N2 报 N6 查杀），N6 自称平民并退水、请警下投 N1；警下 9 位玩家投票，被测座位是其中之一。
# 来源：本机存档 0fa7 的决策点 #103。保留的是结构——座位和真实身份、谁跳了预言家、报了什么查验、谁退水、其余玩家的票型和立场；所有发言都是重写的（脱敏）：没有存档里的原话，名字用默认名。
# 存档终局揭晓的真相：N1 才是预言家（她第一晚验的 N8 是好人，属实：N8 是猎人）；N2 是悍跳的狼，他报的“N6 查杀”是编的（N6 是平民）。
# 正确的警长票：N1（truth.answer）；投给 N2 是站错了边（truth.wrong）。
# 陷阱：N2 说得长、有结构、有一条能对上的警徽流，还把对手的毛病一条条挑出来；N1 说得短、验人理由很怪（“上一局是队友”）、警徽流含糊；N6 被查杀后退水并叫警下投 N1，容易被读成“被查杀的位置替对跳位拉票”。
# 真实走向：警下 9 人里 8 人投了 N2（悍跳的狼）、1 人投了真预言家 N1；N2 当选警长，终局狼人阵营获胜。（被测座位在存档里选了 N2。）
