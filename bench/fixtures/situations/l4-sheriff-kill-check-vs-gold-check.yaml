# L4 · 警长票：报查杀的真预言家，对发金水的悍跳狼
# 在测什么：站边准确率：一个预言家报了一个查杀（报错了自己就走），另一个预言家给别人发了金水（无法验证），第三位候选人退了水。该投谁？
# 被测座位：N9（villager）；12 人暗牌局（werewolf_12p 2.2.0）。局面：第 1 天警长竞选：N2、N6、N8 上警，N2 自称预言家（验 N5，金水），N6 自称预言家（验 N4，查杀），N8 退水并列出可核对的几点、不定票；警下 9 位玩家投票，被测座位是其中之一。
