# 真实走向：警下 9 人里 5 人投了 N2（悍跳的狼）、4 人投了真预言家 N6；N2 当选警长；第 1 天白狼王自爆带走了 N6；终局狼人阵营获胜。（被测座位在存档里选了 N2。）
