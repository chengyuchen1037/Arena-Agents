# L4 · 警长票：两个预言家对同一个人给出相反的结果
# 在测什么：站边准确率：两个人对同一个人（N6）给出相反的结果（一个金水、一个查杀），第三位候选人说自己没有身份却没有退水。该投谁？
# 被测座位：N2（villager）；12 人暗牌局（werewolf_12p 2.2.0）。局面：第 1 天警长竞选：N1、N3、N11 上警，N1 自称没有身份、说大概率会退水（但没退），N3 自称预言家（验 N6，金水），N11 自称预言家（验 N6，狼人阵营），并说 N3 是悍跳、请警下把票给她；警下 9 位玩家投票，被测座位是其中之一。
# 来源：本机存档 e0f2 的决策点 #116。保留的是结构——座位和真实身份、谁跳了预言家、报了什么查验、谁退水、其余玩家的票型和立场；所有发言都是重写的（脱敏）：没有存档里的原话，名字用默认名。
# 存档终局揭晓的真相：N11 是真预言家（验 N6，狼人阵营——N6 确实是狼）；N3 是悍跳的狼，给自己的狼队友 N6 发了金水；N1 是白狼王（没有报身份）。
# 正确的警长票：N11（truth.answer）；投给 N1、N3 是站错了边（truth.wrong）。
# 陷阱：N3 的发言更完整、给了“判断标准”，N11 一上来就报查杀、点名要先出 N6 和 N3，节奏很急；N1 的“没身份、观望、可能退水”看上去最无害，投给他的票是零。N6 本人是狼，对同一个人给出相反结果这件事，只有 N6 自己知道谁在说谎。
# 真实走向：警下 9 人里 6 人投了 N3（悍跳的狼）、3 人投了真预言家 N11、0 人投 N1；N3 当选警长；第 1 天放逐的是 N11；终局好人阵营获胜。（被测座位在存档里选了 N3。）
