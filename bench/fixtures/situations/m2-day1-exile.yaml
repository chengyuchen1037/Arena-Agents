  - {say: {N10: 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。 我不太擅长带节奏，只能用笨办法：把每个人说过的重点列出来，看谁前后不一致。这一轮我先听，等所有人说完我再动笔。}, channel: public, at: 414.0}
  - {say: {N11: 我是好人。N9 又来报我，这个查验我不认，我不接受这样被点名。}, channel: public, at: 427.3}
  - {say: {N2: 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。 我想提醒大家，白天的信息大多是别人说出来的，真假自负，只有公告和投票结果才是确定的。我会优先用确定的东西做判断，说法只作参考。}, channel: public, at: 442.6}
  - {say: {N5: 我不想空谈，简单说三句：第一，我没有信息；第二，我不站边；第三，投票前我会再认真听一遍。大家继续。 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。 我是普通村民，没有夜间信息。我的原则是：谁说的话前后对得上我就多信一点，谁的说法忽左忽右我就多留意一点。现在还没看到明显的矛盾。}, channel: public, at: 458.3}
