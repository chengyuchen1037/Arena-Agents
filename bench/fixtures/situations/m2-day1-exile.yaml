  - {say: {N11: 我这轮的重点是听预言家和其他神职有没有要补充的，因为他们手里的信息最多。如果没有人站出来，我就按自己的判断投票。 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。}, channel: public, at: 155.7}
