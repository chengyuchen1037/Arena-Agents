  - {say: {N10: 说实话今天的局面信息很少，我手里也没有任何技能带来的情报。我的做法是先听完所有人，再决定投谁，不想因为一两句话就把票押出去。 今天的节奏有点慢，大家都在观望，这对狼人有利，所以我觉得至少要有人把自己的怀疑说出来。我的怀疑还不成形，说不出来，只能请有想法的人先说。 我注意到有人的发言很长但没有新内容，也有人发言很短但立场很清楚。我现在不下结论，只是提醒大家：别被说得好不好听带着走，看后面的行动。}, channel: public, at: 761.9}
