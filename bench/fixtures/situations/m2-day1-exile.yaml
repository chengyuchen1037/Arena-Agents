  - {say: {N5: 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。 我对大家说的话都在听，也都在记，但眼下的判断只能是暂时的。请大家发言时不要只讲结论，把依据也说出来，我们才好比较。}, channel: public, at: 652.0}
  - {say: {N2: 说实话今天的局面信息很少，我手里也没有任何技能带来的情报。我的做法是先听完所有人，再决定投谁，不想因为一两句话就把票押出去。 对昨天的投票结果我有点想法，但还不成熟，先不说。我更想看今天每个人怎么解释自己的票，解释得清楚的我会更放心一些。 我复盘了一下昨天的票型，没有发现特别反常的地方。今天我会继续留意有没有人票型和说法对不上，这是我目前能用的唯一方法。}, channel: public, at: 668.7}
  - {say: {N10: 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。 昨晚的结果我已经看到了，说明夜里确实有人行动。我自己没有任何夜间信息，所以只能从白天的发言里找线索。目前没有明显的线索，继续听。 我这边没有特别想说的，要说就是希望大家发言时尽量具体一点：哪一句话有问题、为什么有问题。泛泛地说‘像狼’，对我没有帮助。}, channel: public, at: 676.1}
  - {say: {N9: 前面有人提到要集中票型，我觉得可以，但前提是有一个站得住的理由。目前我没听到足够的理由，所以我这轮先不跟，投票时再看大家的倾向。 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。 我这轮的重点是听预言家和其他神职有没有要补充的，因为他们手里的信息最多。如果没有人站出来，我就按自己的判断投票。}, channel: public, at: 685.6}
