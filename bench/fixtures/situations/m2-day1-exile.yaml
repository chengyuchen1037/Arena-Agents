  - {say: {N7: 我把前面几位的发言都过了一遍，目前大家说的都是各自的判断，没有谁给出能被核对的东西。我这轮不想硬站边，先把几个人的说法记下来，等后面有了新信息再对照。 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。 我是普通村民，没有夜间信息。我的原则是：谁说的话前后对得上我就多信一点，谁的说法忽左忽右我就多留意一点。现在还没看到明显的矛盾。}, channel: public, at: 485.6}
