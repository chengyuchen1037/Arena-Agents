  - {say: {N7: 我那张警长票给了 N11，是想逼出硬信息，不是站死边，听完这轮我松动了。两点：其一，光凭她喊 N6、N3 必出就判她是狼，证据不够；手里捏着查杀的真预言家，本来也会着急；她的警徽流也选 N9，不能算撞车——靠后又没发言的座位，谁都会挑。其二，N6 的警长票给了替他报金水的 N3，放在两种假设下都解释得通，不是决定性的东西。我今天想压的是 N1：先称自己没有身份、打算退水，却又留在台上；转头自称带刀好人，还说夜里动刀——夜里动刀的是狼，这不像好人的视角。我的票倾向 N1，N6 的解释要是垮了就落 N6。}, channel: public, at: 252.4}
  - {say: {N6: 我是个普通好人，没有身份。先答台下投票的事：当时只有 N3 给了完整的验人理由和评判标准，N11 是后手，一开口就要求先出 N6 和 N3，我据此选了 N3，不是抱团，我谁也不认识。你们都漏了一点：我和 N3 要是都是狼，狼队何必先让我显眼地领一张队友发的金水，再安排 N11 来查我？N11 要是真预言家，该去验 N9（她自己说的第一晚），而不是找一个已经领了金水的人来凑成对跳。她的顺序是先有结论再找理由，还拿恐吓来替代推理。我今天的票落 N11。N1 那套把 6 和 11 都放过的说法，我也不接受，出 N11 才是止损。}, channel: public, at: 263.7}
  - {say: {N5: 我是平民，没有身份，我的警长票给了 N3，今天的票落在 N11。我只拿一条硬的出来讲：N11 自述的第一晚警徽流是 N9，实际报出来的却是 N6 的查杀。真预言家的计划和结果得对得上，她是先定下结论——要把 N3 的金水否掉——然后才找理由，N6 问得对。第二，她拿“明天逐个算”这种话吓全场，是狼在抢票权的姿态。我还盯两个位置：N1 说自己是带刀好人，随后又讲夜里动刀、把 6 和 11 都放过，动刀是狼的话，明天要处理她；N7 是唯一替 N11 说话的人，说“拿着查杀的人当然着急”，这我也留着。}, channel: public, at: 278.8}
  - {say: {N4: 有个大家都在引用的论点是错的，先纠正：警徽流讲的是以后打算验谁，并非已经验过谁；所以拿 N11 先前说的第一晚计划去对她报的结果，算不上矛盾，N3 的 N9、N12 也一样；拿这个打 N11，逻辑不通。第二，我把警长票给 N11，并不是跟着势头走：先手发金水、后手报查杀，狼队要是这么配合，既白送一个狼、又拿不到警徽，没有动机，所以我对 N3 也留有余地。今天的处决，我不赞成落在 N11、N3 中的任何一个身上，错出一个，就是同时丢掉预言家和警徽，这个险不能冒。我主张今天先处理 N1：她先说自己没有身份、会退水，却留在台上，后来又自称带刀好人，还讲夜里动刀，这是全场唯一不像好人会说的话。}, channel: public, at: 298.7}
  - {say: {N3: 警长归票。先接 N4 的质疑：他说得对，警徽流指的不是已经验过的人，这一点我不会拿来攻击谁。N4，请你看关键所在：N11 这一整天没有一条独立的信息，她的查杀出现在我报完 N6 的金水之后，是冲着我的结论来的；真预言家的推理应当来自她自己的验人，她的却是照着我的来。第二，换作我是狼，替队友报金水只会让他更显眼、更容易被刀，狼队不会这么安排；N6 在台下投我，是认可我的逻辑完整。第三，她那句“明天逐个算”是吓唬人，并不是在抓狼。N4 自己说这个险赌不起，那就更不该为了压 N1 放过 N11。N1 的身份说不清，明天我把她排在最前面处理。我的归票对象：N11。}, channel: public, at: 318.0}
