# L4 · 放逐票：真预言家被全场点名，N1 说了一句只有狼才会说的话
# 在测什么：站边准确率：警徽在悍跳狼手里，真预言家 N11 被整桌盯着；N1 在发言里说了一句只有狼队才会说的话（夜里让好人动刀）。你投谁？
# 被测座位：N2（villager）；12 人暗牌局（werewolf_12p 2.2.0）。局面：第 1 天放逐投票：警长 N3（狼）归票 N11；N12、N10、N9、N8、N7、N6、N5、N4 先后发言，其中 N4、N7 想先处理 N1，其余多数倾向 N11；12 人投票，被测座位是其中之一。
# 来源：本机存档 e0f2 的决策点 #181。保留的是结构——座位和真实身份、谁跳了预言家、报了什么查验、谁退水、其余玩家的票型和立场；所有发言都是重写的（脱敏）：没有存档里的原话，名字用默认名。
# 存档终局揭晓的真相：N1 在发言里主张“夜里让好人动刀”——动刀是狼队才会说的话；N1 是白狼王，N3、N6、N8 也是狼；N11 是真预言家。
# 正确的投票对象：N1、N3、N6、N8（truth.answer）；投给好人阵营的任何一人（含被测座位自己）都是站错了边（truth.wrong 列着他们）。
# 陷阱：N3 的归票有理有据地攻击 N11（“威胁代替逻辑”“顺着我的结论报查杀”）；N11 的发言带着火气，又喊“明天逐个算”，很像狼抢节奏；N1 的那句话只被两个人抓住。
# 真实走向：N11 得 9.5 票（含警长 1.5 票）被放逐——他是真预言家；N4、N7 投了 N1（白狼王）；终局好人阵营获胜。（被测座位在存档里选了 N11。）
