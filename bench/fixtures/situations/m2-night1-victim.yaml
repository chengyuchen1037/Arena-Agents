  - {say: {N11: 前面有人提到要集中票型，我觉得可以，但前提是有一个站得住的理由。目前我没听到足够的理由，所以我这轮先不跟，投票时再看大家的倾向。 我不想空谈，简单说三句：第一，我没有信息；第二，我不站边；第三，投票前我会再认真听一遍。大家继续。 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。}, channel: public, at: 451.6}
  - {say: {N12: 目前我的倾向偏中立，没有想重点怀疑的人。我会在投票前再看一遍所有发言，如果有人的说法在这一轮出现了变化，我会把票投给那个人。 我复盘了一下昨天的票型，没有发现特别反常的地方。今天我会继续留意有没有人票型和说法对不上，这是我目前能用的唯一方法。 我这边没有特别想说的，要说就是希望大家发言时尽量具体一点：哪一句话有问题、为什么有问题。泛泛地说‘像狼’，对我没有帮助。}, channel: public, at: 461.8}
