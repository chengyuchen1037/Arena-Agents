  - {say: {N4: 前面有人提到要集中票型，我觉得可以，但前提是有一个站得住的理由。目前我没听到足够的理由，所以我这轮先不跟，投票时再看大家的倾向。 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。}, channel: public, at: 493.8}
  - {say: {N5: 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。 对昨天的投票结果我有点想法，但还不成熟，先不说。我更想看今天每个人怎么解释自己的票，解释得清楚的我会更放心一些。 我想提醒大家，白天的信息大多是别人说出来的，真假自负，只有公告和投票结果才是确定的。我会优先用确定的东西做判断，说法只作参考。}, channel: public, at: 510.3}
  - {say: {N6: 这一轮我想听听每个人对昨晚结果的看法，因为那是目前唯一确定的事实。我自己没有怀疑对象，等发言轮完我再认真选一个，不会随便弃票。 我对大家说的话都在听，也都在记，但眼下的判断只能是暂时的。请大家发言时不要只讲结论，把依据也说出来，我们才好比较。 目前我的倾向偏中立，没有想重点怀疑的人。我会在投票前再看一遍所有发言，如果有人的说法在这一轮出现了变化，我会把票投给那个人。}, channel: public, at: 521.1}
