  - {say: {N6: 对昨天的投票结果我有点想法，但还不成熟，先不说。我更想看今天每个人怎么解释自己的票，解释得清楚的我会更放心一些。 我这边没有特别想说的，要说就是希望大家发言时尽量具体一点：哪一句话有问题、为什么有问题。泛泛地说‘像狼’，对我没有帮助。 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。}, channel: public, at: 674.4}
