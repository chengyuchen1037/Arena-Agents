  - {say: {N12: 说实话今天的局面信息很少，我手里也没有任何技能带来的情报。我的做法是先听完所有人，再决定投谁，不想因为一两句话就把票押出去。 昨晚的结果我已经看到了，说明夜里确实有人行动。我自己没有任何夜间信息，所以只能从白天的发言里找线索。目前没有明显的线索，继续听。 今天的节奏有点慢，大家都在观望，这对狼人有利，所以我觉得至少要有人把自己的怀疑说出来。我的怀疑还不成形，说不出来，只能请有想法的人先说。}, channel: public, at: 447.6}
  - {say: {N3: 今天的节奏有点慢，大家都在观望，这对狼人有利，所以我觉得至少要有人把自己的怀疑说出来。我的怀疑还不成形，说不出来，只能请有想法的人先说。 我把今天要关注的点列了一下：谁的发言和昨天不一致、谁的投票和表态不一致、谁在回避问题。眼下三项里我都还没有明确的人选，继续听。 对昨天的投票结果我有点想法，但还不成熟，先不说。我更想看今天每个人怎么解释自己的票，解释得清楚的我会更放心一些。}, channel: public, at: 459.2}
  - {say: {N4: 我对大家说的话都在听，也都在记，但眼下的判断只能是暂时的。请大家发言时不要只讲结论，把依据也说出来，我们才好比较。 刚才有人说得很满，但没有给出任何细节，这让我有点在意。不过也可能只是他表达的方式如此，我先记下，等更多信息再判断。 我是普通村民，没有夜间信息。我的原则是：谁说的话前后对得上我就多信一点，谁的说法忽左忽右我就多留意一点。现在还没看到明显的矛盾。}, channel: public, at: 470.1}
  - {say: {N5: 我的发言不长：目前没有重点怀疑的对象，也没有想保的人。投票时我会看谁的票型前后一致，谁的发言前后一致，按这两条来选。 我想先把话说在前面：我今天的投票会基于确定的信息，而不是某个人的气势。谁的话听上去有道理，我会拿后面的事实去验证它。 从规则上讲，今天出局的人不会翻牌，所以我们能依靠的只有发言和投票。我准备把每个人的发言简单记一笔，晚上再对照，希望大家发言也尽量留下可核对的细节。}, channel: public, at: 480.4}
  - {say: {N6: 我把前面几位的发言都过了一遍，目前大家说的都是各自的判断，没有谁给出能被核对的东西。我这轮不想硬站边，先把几个人的说法记下来，等后面有了新信息再对照。 我不太擅长带节奏，只能用笨办法：把每个人说过的重点列出来，看谁前后不一致。这一轮我先听，等所有人说完我再动笔。 我复盘了一下昨天的票型，没有发现特别反常的地方。今天我会继续留意有没有人票型和说法对不上，这是我目前能用的唯一方法。}, channel: public, at: 498.8}
