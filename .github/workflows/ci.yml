name: CI

on:
  push:
    branches: [main, "v0.*-dev", "dev/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux 覆盖 Docker/Secret 主密钥路径；Windows 覆盖 DPAPI 主密钥包装路径。
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # 前端测试（tests/frontend/*.js）需要 node；没有 node 时 pytest 会跳过它们。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 用与镜像相同的锁定版本跑测试，再补装 pytest。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install "pytest>=8.0,<10.0"

      # tests/conftest.py 会把 ARENA_DATA_DIR 指到临时目录；测试全部使用 mock，不访问真实 Provider。
      - name: Run tests
        run: python -m pytest -q

  docker:
    # 仅验证镜像能构建、compose 文件语法正确、镜像内没有本机缓存/密钥（不推送）。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    env:
      # 仅用于 `compose config` 语法校验的占位路径；compose 要求该变量必填（fail closed）。
      ARENA_MASTER_KEY_HOST_FILE: ./ci-master-key.placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Compose requires the master key path (fail closed)
        run: |
          if env -u ARENA_MASTER_KEY_HOST_FILE docker compose -f docker-compose.yml config -q 2>/dev/null; then
            echo "compose 在缺少 ARENA_MASTER_KEY_HOST_FILE 时应当失败" >&2
            exit 1
          fi

      - name: Build image
        run: docker build -t arena-agents:ci .

      - name: Inspect image
        run: |
          test "$(docker run --rm --entrypoint id arena-agents:ci -u)" = "10001"
          docker run --rm --entrypoint python arena-agents:ci -c "import cryptography, anthropic, openai, fastapi; import app.main"
          # 本机缓存与密钥不得进入镜像
          test "$(docker run --rm --entrypoint sh arena-agents:ci -c 'find /app \( -name __pycache__ -o -name "*.pyc" -o -name ".env" -o -name "*.enc" \) | wc -l')" = "0"
          # /data 必须对 arena 可写，且默认指向 /data
          docker run --rm --entrypoint sh arena-agents:ci -c 'test "$ARENA_DATA_DIR" = /data && touch /data/.w && rm /data/.w'
