art">💭</text><text x="298" y="298.2" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">thinking</text><rect x="494" y="278" width="58" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" /><text x="502" y="298.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">⚡</text><rect x="552" y="278" width="96" height="32" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" /><text x="560" y="298.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💤</text><rect x="648" y="278" width="76" height="32" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><text x="656" y="298.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💭</text><rect x="724" y="278" width="288" height="32" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" /><text x="732" y="298.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💤</text><rect x="176" y="346" width="94" height="32" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" /><text x="184" y="366.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💤</text><rect x="270" y="346" width="342" height="32" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><text x="278" y="366.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💭</text><text x="298" y="366.2" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">thinking (round 1)</text><rect x="612" y="346" width="58" height="32" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" /><text x="620" y="366.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">⚡</text><rect x="670" y="346" width="120" height="32" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><text x="678" y="366.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💭</text><text x="698" y="366.2" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start">round 2</text><rect x="790" y="346" width="222" height="32" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" /><text x="798" y="366.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💤</text><rect x="176" y="414" width="836" height="32" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3" /><text x="184" y="434.6" font-size="13" font-weight="400" fill="#334155" text-anchor="start">💤</text><text x="668" y="434.5" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">out: only events addressed to him wake it</text><circle cx="262" cy="294.0" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><circle cx="262" cy="362.0" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><g stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"><line x1="256.5" y1="424.5" x2="267.5" y2="435.5"/><line x1="256.5" y1="435.5" x2="267.5" y2="424.5"/></g><circle cx="522" cy="226.0" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><circle cx="522" cy="362.0" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="2.4"/><circle cx="522" cy="362.0" r="2.4" fill="#4f46e5"/><g stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"><line x1="516.5" y1="424.5" x2="527.5" y2="435.5"/><line x1="516.5" y1="435.5" x2="527.5" y2="424.5"/></g><circle cx="640" cy="226.0" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><circle cx="640" cy="294.0" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><g stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"><line x1="634.5" y1="424.5" x2="645.5" y2="435.5"/><line x1="634.5" y1="435.5" x2="645.5" y2="424.5"/></g><circle cx="176" cy="478" r="6.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/><text x="190" y="482.4" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">wakes (sleeping → thinking)</text><circle cx="371.12" cy="478" r="7" fill="#ffffff" stroke="#4f46e5" stroke-width="2.4"/><circle cx="371.12" cy="478" r="2.4" fill="#4f46e5"/><text x="385.12" y="482.4" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">arrives mid-run → pending, merged at the next round boundary</text><g stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"><line x1="748.44" y1="472.5" x2="759.44" y2="483.5"/><line x1="748.44" y1="483.5" x2="759.44" y2="472.5"/></g><text x="767.44" y="482.4" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">not delivered to a player who is out</text><rect x="28" y="512" width="317.333" height="122" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#sh)" /><path d="M28 544 V526 Q28 512 42 512 H331.333 Q345.333 512 345.333 526 V544 Z" fill="url(#g-emerald)"/><text x="44" y="533.04" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">Every message wakes</text><text x="42" y="568" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">When the world commits an entry it delivers an</text><text x="42" y="584.5" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Envelope to every agent that can see it (the sender</text><text x="42" y="601" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">excepted); everything of one pump is one activation.</text><rect x="361.333" y="512" width="317.333" height="122" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#sh)" /><path d="M361.333 544 V526 Q361.333 512 375.333 512 H664.667 Q678.667 512 678.667 526 V544 Z" fill="url(#g-indigo)"/><text x="377.333" y="533.04" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">No interruption mid-run</text><text x="375.333" y="568" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">N1 speaks while N2 is still thinking: N2 is not</text><text x="375.333" y="584.5" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">cancelled; the entry waits in pending and is injected</text><text x="375.333" y="601" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">as a DELTA at the next round boundary, after the call</text><text x="375.333" y="617.5" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">returns and the tools ran.</text><rect x="694.667" y="512" width="317.333" height="122" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)" /><path d="M694.667 544 V526 Q694.667 512 708.667 512 H998 Q1012 512 1012 526 V544 Z" fill="url(#g-amber)"/><text x="710.667" y="533.04" font-size="14" font-weight="700" fill="#ffffff" text-anchor="start">The commit gate keeps it correct</text><text x="708.667" y="568" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Every action is re-validated at the moment it is</text><text x="708.667" y="584.5" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">committed (floor, membership, length, staleness),</text><text x="708.667" y="601" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">so a world that changed while the agent was</text><text x="708.667" y="617.5" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">thinking cannot produce a wrong write.</text></svg>
