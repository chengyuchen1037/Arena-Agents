<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="871" viewBox="0 0 1040 871" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif"><title id="t">Actor：永远在线的信箱</title><desc id="d">agent.deliver() 的判断树：休眠时 call_soon 安排一次激活；运行时合并，或在 interrupt 命中焦点时取消在途调用；另有闹钟、失败重试与停止三条旁路。</desc><!-- generated by tools/make_diagrams.py - edit the script, not this file --><defs><filter id="sh" x="-6%" y="-6%" width="112%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter><filter id="sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/></filter><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dbe3ee"/></pattern><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><linearGradient id="g-slate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient><linearGradient id="g-white" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient><marker id="ah-0284c7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#0284c7"/></marker><marker id="ah-059669" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#059669"/></marker><marker id="ah-2563eb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#2563eb"/></marker><marker id="ah-334155" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#334155"/></marker><marker id="ah-4f46e5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#4f46e5"/></marker><marker id="ah-64748b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#64748b"/></marker><marker id="ah-7c3aed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#7c3aed"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#d97706"/></marker><marker id="ah-e11d48" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.8 L9.2 5 L0.5 9.2 L2.6 5 Z" fill="#e11d48"/></marker></defs><rect x="0.75" y="0.75" width="1038.5" height="869.5" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="0.75" y="0.75" width="1038.5" height="869.5" rx="18" fill="url(#dots)" opacity="0.7"/><circle cx="34" cy="36" r="7" fill="url(#g-indigo)"/><text x="50" y="42" font-size="21" font-weight="800" fill="#0f172a" text-anchor="start">Actor · 永远在线的信箱</text><text x="34" y="66" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.69" fill="#64748b">deliver()</tspan> 同步、不阻塞：每一条投递都会唤醒 agent；只有 interrupt（带防饥饿保护）才可能取消在途的调用。</text><rect x="28" y="96" width="192" height="208.5" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#sh)" /><path d="M28 128 V110 Q28 96 42 96 H206 Q220 96 220 110 V128 Z" fill="url(#g-emerald)"/><text x="44" y="117.4" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Envelope（信封）</text><text x="42" y="148" font-size="12" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#4338ca">kind</tspan></text><text x="42" y="165" font-size="11.1475" font-weight="400" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">message · floor · request</text><text x="42" y="181" font-size="9.95316" font-weight="400" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">challenge · ability · notice</text><text x="42" y="205" font-size="12" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#4338ca">priority</tspan>：urgent | normal，</text><text x="42" y="222" font-size="12" font-weight="400" fill="#334155" text-anchor="start">只是个标签（写进 trace），不</text><text x="42" y="239" font-size="12" font-weight="400" fill="#334155" text-anchor="start">影响唤醒</text><text x="42" y="260" font-size="12" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#4338ca">interrupt</tspan>：相关的在途工作</text><text x="42" y="277" font-size="12" font-weight="400" fill="#334155" text-anchor="start">已作废</text><rect x="28" y="320.5" width="192" height="134" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)" /><path d="M28 352.5 V334.5 Q28 320.5 42 320.5 H206 Q220 320.5 220 334.5 V352.5 Z" fill="url(#g-slate)"/><text x="44" y="341.9" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">gen（代数）</text><text x="42" y="374.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">每次激活、取消、停止都让</text><text x="42" y="391.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#4338ca">gen</tspan> +1。Worker 在模型调用返</text><text x="42" y="408.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">回后检查：对不上就丢弃结果，</text><text x="42" y="425.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">什么都不写进世界。</text><rect x="28" y="470.5" width="192" height="117" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)" /><path d="M28 502.5 V484.5 Q28 470.5 42 470.5 H206 Q220 470.5 220 484.5 V502.5 Z" fill="url(#g-slate)"/><text x="44" y="491.9" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">焦点（focus）</text><text x="42" y="524.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">= 本次运行已经读到的频道和</text><text x="42" y="541.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">请求。interrupt 只在命中焦点</text><text x="42" y="558.5" font-size="12" font-weight="400" fill="#334155" text-anchor="start">时才会取消。</text><path d="M220 130 L536 130" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-059669)"/><rect x="274.24" y="119.75" width="111.52" height="20.5" rx="10.25" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" opacity="0.96" /><text x="281.24" y="134.025" font-size="11.5" font-weight="500" fill="#065f46" text-anchor="start">Supervisor.pump()</text><rect x="536" y="108" width="208" height="44" rx="22" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6" filter="url(#sh)" /><text x="640" y="134.68" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">agent.deliver(envelope)</text><path d="M640 152 L640 172" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><rect x="536" y="172" width="208" height="46" rx="11" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6" filter="url(#sh)" /><text x="640" y="199.68" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">追加到 pending</text><path d="M640 218 L640 240" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><polygon points="640,240 735,284 640,328 545,284" fill="#ffffff" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" filter="url(#sh)"/><text x="640" y="280.062" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">有 Worker</text><text x="640" y="296.938" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">在运行吗？</text><path d="M545 284 L390 284 Q380 284 380 294 L380 372" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><rect x="420.25" y="273.75" width="23.5" height="20.5" rx="10.25" fill="#ffffff" stroke="#fecdd3" stroke-width="1" opacity="0.96" /><text x="426.25" y="288.025" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="start">否</text><text x="374" y="330" font-size="12" font-weight="700" fill="#475569" text-anchor="end">💤 休眠中</text><rect x="282" y="372" width="196" height="100.2" rx="11" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6" filter="url(#sh)" /><text x="296" y="398.35" font-size="13" font-weight="700" fill="#312e81" text-anchor="start">call_soon</text><text x="296" y="417.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">安排一次激活：同一次泵里投递</text><text x="296" y="435.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">的合成一次；不等待，没有定时</text><text x="296" y="453.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">器</text><path d="M380 472.2 L380 498.2" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><rect x="282" y="498.2" width="196" height="82.2" rx="11" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6" filter="url(#sh)" /><text x="296" y="524.55" font-size="13" font-weight="700" fill="#312e81" text-anchor="start">启动 Worker（gen +1）</text><text x="296" y="544.05" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">取走全部 pending 作为唤醒原</text><text x="296" y="562.05" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">因 → 💭 思考</text><path d="M735 284 L860 284 Q870 284 870 294 L870 340" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><rect x="806.25" y="273.75" width="23.5" height="20.5" rx="10.25" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" opacity="0.96" /><text x="812.25" y="288.025" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">是</text><text x="878" y="322" font-size="12" font-weight="700" fill="#475569" text-anchor="start">💭 / ⚡ 运行中</text><polygon points="870,340 977,392 870,444 763,392" fill="#ffffff" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" filter="url(#sh)"/><text x="870" y="388.062" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">interrupt 且命中</text><text x="870" y="404.938" font-size="12.5" font-weight="700" fill="#78350f" text-anchor="middle">本次运行的焦点？</text><path d="M763 392 L710 392" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-4f46e5)"/><rect x="724.75" y="381.75" width="23.5" height="20.5" rx="10.25" fill="#ffffff" stroke="#fecdd3" stroke-width="1" opacity="0.96" /><text x="730.75" y="396.025" font-size="11.5" font-weight="700" fill="#be123c" text-anchor="start">否</text><rect x="514" y="340" width="196" height="82.2" rx="11" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#sh)" /><text x="528" y="366.35" font-size="13" font-weight="700" fill="#064e3b" text-anchor="start">到下一轮边界合并</text><text x="528" y="385.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">期间到达的信封合成一条</text><text x="528" y="403.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">DELTA 注入对话，不额外等待</text><path d="M870 444 L870 500" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-e11d48)"/><rect x="888.25" y="461.75" width="23.5" height="20.5" rx="10.25" fill="#ffffff" stroke="#a7f3d0" stroke-width="1" opacity="0.96" /><text x="894.25" y="476.025" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">是</text><rect x="750" y="500" width="240" height="100.2" rx="11" fill="#ffffff" stroke="#e11d48" stroke-width="1.6" filter="url(#sh)" /><text x="764" y="526.35" font-size="13" font-weight="700" fill="#881337" text-anchor="start">取消在途调用</text><text x="764" y="545.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#64748b">gen</tspan> +1，过期结果丢弃；Worker 退场</text><text x="764" y="563.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">（最多等 <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.28" fill="#64748b">cancel_grace_s</tspan> = 5 秒）后</text><text x="764" y="581.85" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">带着全部 pending 重新激活</text><text x="750" y="622.2" font-size="11.5" font-weight="400" fill="#9f1239" text-anchor="start">防饥饿：连续被取消 2 次后，下一次 interrupt</text><text x="750" y="638.2" font-size="11.5" font-weight="400" fill="#9f1239" text-anchor="start">改为合并（<tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.81" fill="#9f1239">starvation_limit</tspan>）。</text><rect x="28" y="696.2" width="316" height="150.5" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)" /><path d="M28 728.2 V710.2 Q28 696.2 42 696.2 H330 Q344 696.2 344 710.2 V728.2 Z" fill="url(#g-amber)"/><text x="44" y="717.6" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">⏰ 闹钟：sleep(秒) 到点</text><text x="44" y="750.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Supervisor 每个 tick（<tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">tick_interval</tspan> 0.1 秒）调用</text><text x="44" y="766.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">timer_due(now)</tspan>（游戏时钟，暂停时冻结），到点就</text><text x="44" y="783.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">fire_timer</tspan> 合成 <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">timer.elapsed</tspan> 信封，再走上面</text><text x="44" y="799.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">的 <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">deliver()</tspan>。新信封到达会作废闹钟；若这次激活</text><text x="44" y="816.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">什么也没发生，闹钟恢复。</text><rect x="360" y="696.2" width="316" height="150.5" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)" /><path d="M360 728.2 V710.2 Q360 696.2 374 696.2 H662 Q676 696.2 676 710.2 V728.2 Z" fill="url(#g-rose)"/><text x="376" y="717.6" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">失败与重试</text><text x="376" y="750.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">Worker 抛异常：对话原样不动，指数退避后重试（1</text><text x="376" y="766.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">秒、2 秒……最多重试 <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">llm_retries</tspan> = 2 次）；仍失败</text><text x="376" y="783.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">就放弃这次激活并发出 <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">error</tspan> 事件，不牵连其他</text><text x="376" y="799.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">agent。</text><rect x="692" y="696.2" width="316" height="150.5" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)" /><path d="M692 728.2 V710.2 Q692 696.2 706 696.2 H994 Q1008 696.2 1008 710.2 V728.2 Z" fill="url(#g-slate)"/><text x="708" y="717.6" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">停止 / 暂停</text><text x="708" y="750.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.09" fill="#4338ca">stop()</tspan> 同步且幂等：取消 Worker 和所有计时器、丢</text><text x="708" y="766.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">弃 pending，界面显示 💤。对话留在</text><text x="708" y="783.2" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">ConversationBook 里，继续时沿用；Supervisor 会等</text><text x="708" y="799.7" font-size="11.8" font-weight="400" fill="#334155" text-anchor="start">被取消的 Worker 真正退场，不泄漏任务。</text></svg>
