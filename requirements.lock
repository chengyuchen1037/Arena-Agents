# 完全固定版本的运行时依赖（含传递依赖），用于可复现构建（Dockerfile 使用本文件）。
# 版本取自已通过全部测试的环境（Python 3.12，pip install --target 的结果，读取各 *.dist-info 得到）。
# 仅包含运行时依赖：不含 pytest 及其依赖（pluggy、iniconfig、pygments、packaging）。
#
# 对应的直接依赖见 requirements.txt：fastapi、uvicorn[standard]、openai、anthropic、cryptography、
# pyyaml、pydantic、python-dotenv、httpx。`uvicorn[standard]` 的可选扩展 httptools / watchfiles /
# websockets 已显式固定；uvloop（仅 Linux/macOS 可用）未包含在已验证环境内，故不固定，
# uvicorn 会自动回退到 asyncio 事件循环。cryptography/cffi 在 Linux 上使用官方预编译 wheel。
#
# 更新方式：在新的验证环境里重新读取版本，修改本文件后运行 `pip install -r requirements.lock` 并跑全部测试。
